info:
  title: Open-API
  description: The http Integration API description
  version: "1.0"
  contact: {}
tags:
  - name: Customer
    description: ""
  - name: Payout Methods
    description: ""
  - name: Beneficiary
    description: ""
  - name: Payout
    description: ""
  - name: Transactions
    description: ""
  - name: Buy Gift Card
    description: ""
  - name: Sell Gift Card
    description: ""
  - name: Miscellaneous
    description: ""
servers:
  - url: http://localhost:3050
    description: Local environment
  - url: https://api-staging.novacrust.com
    description: Staging environment
  - url: https://api-dev.novacrust.com
    description: Develop environment
components:
  securitySchemes:
    api-key:
      type: apiKey
      in: header
      name: authorization
  schemas:
    OpenApiCreateCustomerDto:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        phone_number:
          type: string
          pattern: /^\+?[1-9]\d{1,14}$/
          description: Phone number of the business
        country:
          type: string
          example: USA
        address:
          type: string
          example: 123 Main St
          description: Street address. Required when run_kyc_check is true. If provided,
            run_kyc_check must be true.
        postal_code:
          type: string
          example: "12345"
          description: Postal/ZIP code. Required when run_kyc_check is true. If provided,
            run_kyc_check must be true.
        customer_type:
          enum:
            - INDIVIDUAL
            - BUSINESS
          type: string
        state:
          type: string
          example: California
          description: State/Province. Required when run_kyc_check is true. If provided,
            run_kyc_check must be true.
        city:
          type: string
          example: Los Angeles
          description: City name. Required when run_kyc_check is true. If provided,
            run_kyc_check must be true.
        kyc_metadata:
          type: object
          example:
            id_type: NIGERIAN_BVN_VERIFICATION
            bvn: "22222222222222"
            selfie_image: https://image.com
          description: KYC verification metadata. Required when run_kyc_check is true. If
            provided, run_kyc_check must be true.
        run_kyc_check:
          type: boolean
          example: true
          description: "Whether to run KYC verification. Must be true if any of the
            following fields are provided: address, postalCode, state, city,
            kyc_metadata."
      required:
        - first_name
        - last_name
        - email
        - phone_number
        - country
        - customer_type
        - run_kyc_check
    OpenApiUpdateCustomerDto:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        phone_number:
          type: string
          pattern: /^\+?[1-9]\d{1,14}$/
          description: Phone number of the business
        country:
          type: string
          example: USA
        address:
          type: string
          example: 123 Main St
          description: Street address. Required when run_kyc_check is true.
        postal_code:
          type: string
          example: "12345"
          description: Postal/ZIP code. Required when run_kyc_check is true.
        customer_type:
          enum:
            - INDIVIDUAL
            - BUSINESS
          type: string
        state:
          type: string
          example: California
          description: State/Province. Required when run_kyc_check is true.
        city:
          type: string
          example: Los Angeles
          description: City name. Required when run_kyc_check is true.
        kyc_metadata:
          type: object
          example:
            id_type: NIGERIAN_BVN_VERIFICATION
            bvn: "22222222222222"
            selfie_image: https://image.com
          description: KYC verification metadata. Required when run_kyc_check is true.
        run_kyc_check:
          type: boolean
          example: true
          description: Whether to run KYC verification.
    OpenApiInitiateBusinessPayoutDTO:
      type: object
      properties:
        currency:
          enum:
            - usd
            - ngn
            - ghs
            - eur
            - gbp
            - kes
            - zar
            - ugx
            - tzs
            - xof
            - rwf
            - zmw
            - xaf
            - gmd
            - lrd
            - mwk
            - etb
            - egp
            - sle
            - usdt
            - usdc
            - btc
            - eth
            - sol
            - trx
            - local_currency
          type: string
          description: The currency
          example: ngn
        beneficiary_uuid:
          type: string
          description: The uuid of the customer's beneficiary
          example: ""
        payout_method_uuid:
          type: string
          description: The uuid of the payout method
          example: ""
        amount:
          type: number
          minimum: 0.01
          description: The amount to payout
          example: ""
        description:
          type: string
          description: The description
          example: owambe
        reference:
          type: string
          description: Your reference
      required:
        - currency
        - beneficiary_uuid
        - payout_method_uuid
        - amount
        - description
        - reference
    OpenApiCreateBeneficiaryDTO:
      type: object
      properties:
        currency:
          enum:
            - usd
            - ngn
            - ghs
            - eur
            - gbp
