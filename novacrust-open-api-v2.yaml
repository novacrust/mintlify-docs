openapi: 3.0.0
paths:
  /api/v1/business/open/customer:
    post:
      description: "

        \      Creates a new customer with optional KYC verification.

        \     \ 

        \      **KYC Validation Rules:**

        \      - If run_kyc_check is true, the following fields are required:
        address, postal_code, state, city, kyc_metadata

        \      - If any of these fields (address, postal_code, state, city,
        kyc_metadata) are provided, run_kyc_check must be set to true

        \      - If run_kyc_check is false, none of the KYC fields should be
        provided

        \    "
      operationId: createCustomer
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenApiCreateCustomerDto"
            examples:
              withKyc:
                summary: Create customer with KYC
                description: Example with KYC verification enabled
                value:
                  first_name: John
                  last_name: Doe
                  email: john.doe@example.com
                  phone_number: "+1234567890"
                  country: USA
                  customer_type: INDIVIDUAL
                  run_kyc_check: true
                  address: 123 Main St
                  postal_code: "12345"
                  state: California
                  city: Los Angeles
                  kyc_metadata:
                    id_type: NIGERIAN_BVN_VERIFICATION
                    bvn: "22222222222222"
                    selfie_image: https://image.com
              withoutKyc:
                summary: Create customer without KYC
                description: Example without KYC verification
                value:
                  first_name: Jane
                  last_name: Smith
                  email: jane.smith@example.com
                  phone_number: "+1987654321"
                  country: USA
                  customerType: INDIVIDUAL
                  run_kyc_check: false
      responses:
        "201":
          description: Customer created successfully
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                example:
                  statusCode: 400
                  message:
                    - Address is required when KYC check is enabled
                    - run_kyc_check must be true when address, postal_code,
                      state, city, or kyc_metadata are provided
                  error: Bad Request
      summary: Create Customer
      tags: &a1
        - Customer
  /api/v1/business/open/customer/all:
    get:
      operationId: findAll
      parameters:
        - name: page
          required: true
          in: query
          schema:
            type: number
        - name: limit
          required: true
          in: query
          schema:
            type: number
      responses:
        "200":
          description: ""
      summary: List Customer
      tags: *a1
  /api/v1/business/open/customer/{uuid}:
    get:
      operationId: findOne
      parameters:
        - name: uuid
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Get Customer
      tags: *a1
    patch:
      description: "

        \      Updates an existing customer with optional KYC verification.

        \     \ 

        \      **KYC Validation Rules:**

        \      - If run_kyc_check is true, the following fields are required:
        address, postal_code, state, city, kyc_metadata

        \      - If any of these fields (address, postal_code, state, city,
        kyc_metadata) are provided, run_kyc_check must be set to true

        \      - If run_kyc_check is false, none of the KYC fields should be
        provided

        \      - All fields are optional; only provide the fields you want to
        update

        \    "
      operationId: update
      parameters:
        - name: uuid
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenApiUpdateCustomerDto"
            examples:
              withKyc:
                summary: Update customer with KYC
                description: Example with KYC verification enabled
                value:
                  first_name: John
                  last_name: Doe
                  email: john.doe@example.com
                  phone_number: "+1234567890"
                  country: USA
                  customer_type: INDIVIDUAL
                  run_kyc_check: true
                  address: 123 Main St
                  postal_code: "12345"
                  state: California
                  city: Los Angeles
                  kyc_metadata:
                    id_type: NIGERIAN_BVN_VERIFICATION
                    bvn: "22222222222222"
                    selfie_image: https://image.com
              withoutKyc:
                summary: Update customer without KYC
                description: Example without KYC verification - only update basic fields
                value:
                  first_name: Jane
                  last_name: Smith
                  email: jane.smith@example.com
                  phone_number: "+1987654321"
                  country: USA
              partial:
                summary: Partial update
                description: Update only specific fields
                value:
                  email: newemail@example.com
                  phone_number: "+1555555555"
      responses:
        "200":
          description: Customer updated successfully
        "400":
          description: Validation error or invalid customer UUID
          content:
            application/json:
              schema:
                example:
                  statusCode: 400
                  message:
                    - Invalid customer uuid
                    - Address is required when KYC check is enabled
                    - run_kyc_check must be true when address, postal_code,
                      state, city, or kyc_metadata are provided
                  error: Bad Request
        "404":
          description: Customer not found
      summary: Update Customer
      tags: *a1
    delete:
      operationId: remove
      parameters:
        - name: uuid
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Delete Customer
      tags: *a1
